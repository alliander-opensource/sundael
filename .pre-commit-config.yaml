# This pre-commit config can be installed by running
# 'pip install pre-commit'.
# 'pre-commit install'.
# You can find the current Autobahn's settings at:
# https://github.com/Alliander/Autobahn/blob/main/actions/common/code-quality/ruff.toml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.1.11
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v0.950
    hooks:
      - id: mypy
